name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate audio assets
        run: python3 tool/gen_audio.py

      - name: Regenerate platform folders
        run: |
          flutter create --platforms=android --org com.jellypop --project-name jelly_pop .
          rm -f test/widget_test.dart

      - name: Patch Android config
        run: python3 tool/patch_android.py

      - name: Generate launcher icons
        run: |
          pip install pillow
          python3 tool/gen_icons.py

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: jelly-pop-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi APK
        uses: actions/upload-artifact@v4
        with:
          name: jelly-pop-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x64 APK
        uses: actions/upload-artifact@v4
        with:
          name: jelly-pop-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Attach APKs to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
